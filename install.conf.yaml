- defaults:
    link:
      relink: true
      create: true
- clean: ['~']

- shell:
    - command: 'if [ "$(uname)" = "Darwin" ]; then brew bundle --file=installers/macos/Brewfile; fi'
      description: Installing Homebrew bundle (macOS only)
      stderr: true

- create:
    - ~/.local/share/kitty
    - ~/.local/share/claude

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.gitconfig: git/gitconfig
    ~/.gdbinit: gdbinit
    ~/.config/nvim: config/nvim
    ~/.vifm/vifmrc: config/vifm/vifmrc
    ~/.config/atuin/config.toml: config/atuin/config.toml
    ~/.config/bat/config: config/bat/config
    ~/.config/wezterm: config/wezterm
    ~/.gitignore: git/gitignore
    ~/.config/ghostty:  config/ghostty
    ~/.config/kitty:  config/kitty
    ~/.tigrc:  config/tigrc
    ~/.config/lazygit/config.yml:  config/lazygit/config.yml
    ~/Library/Preferences/clangd/config.yaml: clangd/config.yaml
    ~/.config/autostart/albert.desktop:
        if: '[ `uname` = Linux ]'
        path: config/autostart/albert.desktop
    ~/Library/Application Support/lazygit/config.yml:
        if: '[ `uname` = Darwin ]'
        path: config/lazygit/config.yml
    ~/Library/Application Support/neocmakelsp/config.toml:
        if: '[ `uname` = Darwin ]'
        path: config/neocmakelsp/config.toml
    ~/Library/LaunchAgents/com.bartek.glances.plist:
        if: '[ `uname` = Darwin ]'
        path: config/launchd/glances.xml
    ~/Library/LaunchAgents/com.bartek.dark-notify.plist:
        if: '[ `uname` = Darwin ]'
        path: config/launchd/com.bartek.dark-notify.plist
    ~/Library/LaunchAgents/com.bartek.ha-mcp-tunnel.plist:
        if: '[ `uname` = Darwin ]'
        path: config/launchd/com.bartek.ha-mcp-tunnel.plist
    ~/.config/systemd/user/kitty-theme-sync.service:
        if: '[ `uname` = Linux ]'
        path: config/systemd/user/kitty-theme-sync.service

- shell:
    - command: 'if [ "$(uname)" = "Linux" ] && [ -n "$XDG_RUNTIME_DIR" ]; then systemctl --user daemon-reload && systemctl --user enable --now kitty-theme-sync.service; fi'
      description: Enabling kitty theme-sync service (Linux only)
      stderr: true
