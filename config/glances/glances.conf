# Glances configuration
# Managed in dotfiles: ~/.config/glances -> dotfiles/config/glances
#
# Home Assistant (glances integration, host 192.168.1.159:61208) only needs
# CPU, memory, swap and disk usage. Everything else is disabled here at the
# source so HA never creates the ~150 network-interface / disk-io / temp-mount
# noise entities in the first place. The plugin filters below drop the data
# from the REST API that HA polls (glances filters in plugin update(), so the
# hidden items are absent from /api/4/<plugin>, not merely hidden in the UI).

# --- Disabled plugins (no entities, no polling cost) ---

[network]
disable=True

[diskio]
disable=True

[processcount]
disable=True

# Battery charge comes from the sensors plugin.
[sensors]
disable=True

[uptime]
disable=True

# --- Kept plugins ---
# cpu, load, mem, memswap stay enabled with their defaults.

[fs]
# Expose only the root volume and the macOS user-data volume. All the APFS
# system partitions (VM/Preboot/Update/xarts/iSCPreboot/Hardware/...), DMG
# mounts under /Volumes, and /private temp mounts are dropped.
# Match is re.fullmatch (case-insensitive); show overrides hide.
show=/,/System/Volumes/Data
