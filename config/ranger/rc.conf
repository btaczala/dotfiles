# ranger configuration
# Docs: https://ranger.github.io/ranger.1.html
# vim: ft=conf

# --- previews --------------------------------------------------------------
# scope.sh lives next to this file (~/.config/ranger/scope.sh)
set use_preview_script true
set preview_images true
# kitty image protocol (needs pillow)
set preview_images_method kitty
set collapse_preview true

# --- display ---------------------------------------------------------------
set show_hidden false
set unicode_ellipsis true
set line_numbers relative
set relative_current_zero true
set draw_borders both
set scroll_offset 8
set mouse_enabled true
set dirname_in_tabs true
set hostname_in_titlebar false
set tilde_in_titlebar true
set status_bar_on_top false

# --- sorting ---------------------------------------------------------------
set sort natural
set sort_reverse false
set sort_case_insensitive true
set sort_directories_first true

# --- behavior --------------------------------------------------------------
set confirm_on_delete multiple
set autosave_bookmarks true
set save_console_history true
set cd_bookmarks true

# --- keybindings -----------------------------------------------------------
# rebind hjkl to jkl; (j=left, k=down, l=up, ;=right).
# copymap SRC DST copies SRC's binding to DST; reverse order so each source
# is read before it is overwritten.
copymap l ;
copymap k l
copymap j k
copymap h j

# fzf jump to file (with a count: directories only)
map <C-f> fzf_select
# open current file in the editor
map <C-e> edit
