# vim: ft=cfg
# File opener rules for ranger (rifle).
# First matching rule wins. Conditions: mime/ext/name/path/has/X/terminal/else,
# pseudo-conditions: flag <f|r|t|c>, label <name>. Command vars: $1..$9, $@.

# --- images: view in kitty (same kitten as the vifm image preview) ----------
mime ^image, has kitty = kitty icat --transfer-mode=file -- "$1"
mime ^image, has open, flag f = open -- "$1"
mime ^image, has xdg-open, X, flag f = xdg-open -- "$1"

# --- text & code: edit in nvim ----------------------------------------------
label editor, mime ^text, has nvim = nvim -- "$1"
label editor, mime ^text, has vim = vim -- "$1"

# --- audio/video -------------------------------------------------------------
mime ^audio, has mpv, flag f = mpv -- "$1"
mime ^video, has mpv, flag f = mpv -- "$1"

# --- executables: run in the current terminal --------------------------------
mime application/x-executable = "$1"

# --- everything else: system default opener ----------------------------------
label open, has open, flag f = open -- "$@"
label open, has xdg-open, X, flag f = xdg-open -- "$@"

# --- last resort --------------------------------------------------------------
!mime ^text, has file = file -bL -- "$1"
label pager, has less = less -- "$1"
